[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Daily weather ETL pipeline for Melbourne | Sydney | Perth"
readme = "README.md"
authors = [
    { name = "Jack Nguyen", email = "sagameko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
weather-pipeline = "weather_pipeline.main:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
