api:
  base_url: https://archive-api.open-meteo.com/v1/archive
  timeout_seconds: 30
  timezone: Australia/Sydney
  daily_variables:
    - weather_code
    - temperature_2m_max
    - temperature_2m_min
    - precipitation_sum
    - wind_speed_10m_max

locations:
  - {city: Melbourne, state: VIC, latitude: -37.81, longitude: 144.96}
  - {city: Sydney,    state: NSW, latitude: -33.87, longitude: 151.21}
  - {city: Brisbane,  state: QLD, latitude: -27.47, longitude: 153.03}
  - {city: Perth,     state: WA,  latitude: -31.95, longitude: 115.86}
  - {city: Adelaide,  state: SA,  latitude: -34.93, longitude: 138.60}

paths:
  raw_dir: data/raw
  clean_dir: data/clean
  database: data/warehouse.db
  log_dir: logs

quality:
  max_bad_ratio: 0.05